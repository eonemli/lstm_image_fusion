# ==============================================================================
# GLOBAL HARDWARE & MICROSCOPY VOLUME STRUCTURE
# ==============================================================================
structure:
  # General list of acquisition folders (handles powers or power+exposure permutations)
  ACQUISITION_MODES: 
    - "power3_exp50"
    - "power15_exp50"
    # - "power3_exp10"
    # - "power3_exp100"
  CHANNEL: "640nm"
  TILES: "auto" # Processes recursively or parses an explicit list of subfolders


# ==============================================================================
# STEP 01: PREPROCESSING - INTENSITY CLIPPING & PERCENTILE SCALING
# ==============================================================================
code_01_preprocessing:
  enabled: true       # Set to false to bypass and directly copy files to output_dir
  
  input_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample_4_0_reduced/sample4"
  output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_1_percentile_clipped"
  
  mode: "percentile"  # Options: "percentile" or "clip"
  min_signal_threshold: 1 # Threshold to isolate empty padding/background frames
  
  percentile_params:
    stride: 8         # Spatial downsampling stride to conserve GPU memory/VRAM
    p_low: 1.0        # Lower percentile anchor for contrast clipping min bound
    p_high: 99.0      # Upper percentile anchor for contrast clipping max bound
    
  limit_params:
    clip_limit: 3000  # Used only if mode is set to "clip"
    
  dataloader:
    batch_size: 16    # Quantity of frames streamed to the compute unit simultaneously
    num_workers: 16    # Parallel CPU workers assigned to background file loading


# ==============================================================================
# STEP 02: HDPR IMAGE-LEVEL PIXEL FUSION (EARLY FUSION)
# ==============================================================================
code_02_fusion:
  enabled: true       # Set to false to bypass the fusion pipeline step
  
  input_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample_4_0_reduced/sample4"
  output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_2_raw_HDPR"
  
  # Background Optimization Management
  min_signal_threshold: 1
  
  # Pipeline Customization Flags
  contrast_stretching: true # Requirement 1: Set to true to enable min-max normalization. Set false for Tile-to-Tile Radiometric Consistency)
  
  weights:
    contrast: 1.0     # High priority: preserves sharp edge details
    saturation: 0.9   # Lowered: avoids emphasizing clipped electronic noise floor
    exposure: 0.1     # Smooths intensity boundaries between exposure gradients
    
  num_cores: 32       # CPU worker pools allocated for cluster processing



# ==============================================================================
# STEP 03: PREPROCESSING - GLOBAL STITCHED MACRO-VOLUME HDPR FUSION
# ==============================================================================
code_03_stitched_fusion:
  enabled: true       # Set to false to bypass this stitched macro-blending step
  
  # Map your custom acquisition mode labels directly to their massive stitched TIFF file paths.
  # This dynamic grid cleanly handles 2, 3, or any arbitrary number of input power/exposure layers.
  input_paths:
    "640_3": "/rsstu/users/a/agrinba/DeepDesign/Fengyi/brain/batch4/sample5_stitched/640_3/RES(8050x7990x491)/426970/426970_283730/426970_283730_306300.tif"
    "640_15": "/rsstu/users/a/agrinba/DeepDesign/Fengyi/brain/batch4/sample5_stitched/640_15/RES(8050x7990x491)/426970/426970_283730/426970_283730_306300.tif"
    # You can seamlessly append additional files as needed:
    # "640_20": "/rsstu/users/a/agrinba/DeepDesign/Fengyi/brain/batch4/sample5_stitched/640_20/..."

  # Destination directory for the fused high-resolution stitched TIFFs and frequency plots
  output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04/sample5_4_YOLO_outputs/sample5_stitched"

  parameters:
    fused_label: "640_HDPR"    # Output label filename prefix for the combined image matrix
    histogram_dpi: 300
    histogram_bins: 256



# ==============================================================================
# STEP 03 2: ON-THE-FLY YOLO INFERENCE & LATE FUSION PIPELINE
# ==============================================================================
code_03_inference:
  paths:
    # Explicit custom execution paths
    # model_path: "/share/lsmsmart/eonemli/yolo/ultralytics/pretrained_models/fengyi_3_brain_one_ch/single_ch_model_weights/weights/best.pt"
    model_path: "/rsstu/users/a/agrinba/DeepDesign/emre/yolo_weights/MADM_single_channel/train18/weights/best.pt"
    model_root: "/share/lsmsmart/eonemli/yolo" # Explicitly sets the Ultralytics module root folder
    
    output_txt_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_txts"
    output_grid_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_grids"

    # Raw Acquisition Datasets (Active Control Branch)
    raw_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample_4_0_reduced/sample4"
    raw_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_2_raw_HDPR"
    
    # Preprocessed Datasets (Optional Control Branch)
    # Note: If "STRETCHED" is removed from process_branches below, these two paths can be entirely commented out
    stretched_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_1_percentile_clipped"
    stretched_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_3_clipped_HDPR"

  yolo:
    classes: 
      0: "neuron"
      1: "glia"
    color_mode: "gray"
    # Target channel mapping layout. 
    # Supported values: "gray" (replicated), "green" (ch1), "red" (ch2), "blue" (ch0)    
    conf_thresh: 0.40
    nms_iou_tiles: 0.25   
    nms_iou_fusion: 0.45  
    tile_size: 640
    step: 544             

  system:
    num_cores: 32         
    num_gpus: 1           
    batch_size: 16        
    generate_grids: false # leave as false to bypass grid generation and only output YOLO .txt predictions. 
    min_signal_threshold: 1
    
    # Dynamic Branch Allocation: Choice of controls to compute ["RAW", "STRETCHED"]. Change to just ["RAW"] to completely ignore stretched assets.
    process_branches: ["RAW"]
    resume: true



# ==============================================================================
# STEP 04: POST-PROCESSING SLICE-LEVEL METADATA LEDGER
# ==============================================================================
code_04_analytics:
  enabled: true       # Set to false to bypass this ledger compilation step
  
  paths:
    # Source directory where YOLO prediction labels (.txt) are exported
    txt_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_txts"
    # Destination folder for the compiled text ledger
    output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_analytics"

  classes:
    0: "Neuron"
    1: "Glia"

  system:
    num_cores: 16       # Concurrent CPU workers assigned to batch parsing



# ==============================================================================
# STEP 05: POST-PROCESSING VISUAL COMPARISON GRID GENERATION
# ==============================================================================
code_05_grid_generation:
  enabled: true       # Set to false to completely bypass figure compilation steps
  
  paths:
    # Source paths for raw data domains
    raw_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample_4_0_reduced/sample4"
    raw_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_2_raw_HDPR"
    stretched_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_1_percentile_clipped"
    stretched_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_3_clipped_HDPR"

    # Input text files containing box locations and slice classifications
    txt_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_txts"
    ledger_path: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_analytics/01_slice_level_comparison.txt"

    # Output directory for categorical panels folders
    output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_grid_figs"
      
  parameters:
    target_samples_per_category: 10   # Quantity of multi-panel grids to generate per subset folder
    random_seed: 42                   # Seed key to maintain strict scientific sample reproducibility
    
    # Unbiased Benchmarking Option
    generate_unbiased_random: true    # Generates a 5th control folder using true random uniform sampling
    variance_threshold_consistent: 4  # Max box count delta allowed for a slice to be Consistent
    variance_threshold_different: 10   # Min box count delta required for a slice to be Different


# ==============================================================================
# STEP 06: POST-PROCESSING AUTOMATED SATURATION OUTLIER MINER
# ==============================================================================
code_06_saturation_finder:
  enabled: true       # Set to false to bypass this mining pipeline step
  
  paths:
    # Target output folder where saturated image subsets are grouped
    output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_saturated_high"
    
    # Active baseline input paths vectors
    raw_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample_4_0_reduced/sample4"
    raw_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_2_raw_HDPR"
    
    # Optional input paths vectors (Can be entirely commented out if not utilized)
    stretched_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_1_percentile_clipped"
    stretched_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_3_clipped_HDPR"

  parameters:
    saturation_threshold: 65000  # 16-bit intensity marker above which a pixel is considered saturated
    search_pool_size: 10000       # Size of random Z-slice population pool to evaluate
    target_count: 50             # Absolute limit of top-saturated slices to extract
    max_per_tile: 25              # Localized safety limit to prevent pulling all frames from one single tile
    random_seed: 42              # Seed key to maintain strict scientific sample reproducibility



# ==============================================================================
# STEP 07: SATURATED IMAGES VISUAL COMPARISON GRID GENERATION (POST-PROCESSING OVEREXPOSURE MULTI-PANEL)
# ==============================================================================
code_07_saturated_comparisons:
  enabled: true       # Set to false to completely bypass figure generation
  
  paths:
    # Source directory containing extracted overexposed subsets (Output from step 06)
    saturated_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_saturated_high"
    # Root folder containing YOLO predictions (.txt)
    txt_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_txts"
    # Destination directory for the generated publication-ready grids
    output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_saturated_figs"

  parameters:
    dpi: 150            # Resolution scale for output comparison matrices
    # Select which pipeline dataset tracks to plot. Options: "RAW", "STRETCHED", or "BOTH"
    dataset_type: "BOTH"



# ==============================================================================
# STEP 08: POST-PROCESSING - TARGETED OPTICAL SLICE DASHBOARD GENERATOR
# ==============================================================================
code_08_specific_slice:
  enabled: true       # Set to false to completely bypass figure extraction
  
  paths:
    # Source image root locations for raw tracking
    raw_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample_4_0_reduced/sample4"
    raw_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_2_raw_HDPR"
    
    # Optional image root locations for preprocessed tracking (Can be commented out if unused)
    stretched_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_1_percentile_clipped"
    stretched_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_3_clipped_HDPR"

    # Input predictions path root folder containing YOLO .txt files
    txt_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_txts"
    # Target directory for the compiled diagnostic figure panels
    output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_specific_figs"

  parameters:
    # An array list of complete coordinate string identifiers of specific Z-slices to inspect.
    # The framework will automatically deduce distinct X_Folder and parent Tile directories for each item.
    target_z_slices:
      - "451400_306700_323420"
      - "451400_306720_323490" # dummy to test if it handles it
      - "451400_306700_323440"
    
    # Select which dataset types to process. Options: "RAW", "STRETCHED", or "BOTH"
    dataset_type: "BOTH"                   
    dpi: 150                                # Image resolution scale for target exports



# ==============================================================================
# STEP 09: POST-PROCESSING - VALIDATION COHORT EXTRACTION ENGINE
# ==============================================================================
code_09_validation_extraction:
  enabled: true       # Set to false to completely bypass validation dataset extraction
  
  paths:
    # Root folder containing YOLO predictions (.txt)
    txt_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_txts"
    # Destination directory where self-contained validation sandboxes are grouped
    output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_validation_subset"
    
    # Active baseline input paths vectors
    raw_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample_4_0_reduced/sample4"
    raw_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_2_raw_HDPR"
    
    # Optional input paths vectors (Will be bypassed gracefully if left blank or missing)
    stretched_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_1_percentile_clipped"
    stretched_hdpr_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_3_clipped_HDPR"

  parameters:
    dataset_type: "RAW"              # Dataset branch to scan and extract. Options: "RAW" or "STRETCHED"
    selection_method: "HDPR_Late"    # The pipeline tracking modality used to evaluate cell/tissue density
    min_detected_cells: 20           # Lower cell count cutoff to filter out empty background frames
    total_slices_to_select: 20       # Total number of unbiased random slices to extract for validation
    random_seed: 42                  # Seed key to guarantee strict statistical cohort reproducibility
    generate_annotated_grids: true   # Set to true to automatically render publication-ready reference panels
    dpi: 150                         # Image resolution scale for target exports




# ==============================================================================
# STEP 10: POST-PROCESSING - GROUND TRUTH MULTI-EXPOSURE LABEL FUSION
# ==============================================================================
code_10_gt_label_fusion:
  enabled: true       # Set to false to bypass human ground-truth consensus building
  
  paths:
    # Points directly to the validation sandbox directory generated in Step 09
    subset_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_validation_subset"

  parameters:
    gt_folder_name: "labels_gt"     # Name of the target subfolder containing human annotations
    nms_iou_threshold: 0.45         # Intersection-over-Union limit to collapse duplicate human entries




# ==============================================================================
# POST-PROCESSING VALIDATION SUITE (STEPS 11, 12, 13)
# ==============================================================================
evaluation_suite:
  paths:
    # Points to the validation sandboxes populated in step 09
    subset_root: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_validation_subset"
    # Destination directory for all evaluation reports, matrices, and scatter plots
    output_dir: "/rsstu/users/a/agrinba/DeepDesign/emre/lsm_data/Batch_04_reduced/sample4_4_YOLO_outputs/sample4_evaluation_results"

  structure:
    gt_folder_name: "labels_gt"     # Folder containing human consensus ground-truth
    gt_file_name: "HDPR_Late.txt"   # Consensus ground-truth file name (Output of step 10)

  parameters:
    iou_threshold: 0.45             # Spatial matching overlap barrier criteria
    dpi: 300                        # Publication high-resolution plot asset scale
    font_scale: 1.2                 # Global scale multiplier for figure labels
    top_k_limit: 10                 # Total slices to pull for golden subset evaluations
    ranking_method: "HDPR_Late"     # Anchor method to score golden subset pool
    ranking_class: "Neuron"         # Target class or "Average" for golden filtering
    # Supported options matching script constraints: "Precision", "Recall", "Accuracy" or "F1"
    ranking_metric: "Accuracy"      # Target score for golden filtering
